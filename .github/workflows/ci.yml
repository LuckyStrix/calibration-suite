name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        # Narrow rule set, configured in pyproject.toml -- mistakes, not style.
        run: python -m ruff check calsuite tests

      - name: Run the suite
        # pyproject sets pythonpath = ["."], so this needs no PYTHONPATH.
        # No hardware or external binaries (exiftool, ArgyllCMS, gphoto2) are
        # present in CI; every test either uses synthetic data / fakes on
        # PATH, or is skipped (local-only smoke tests for real captures and
        # this laptop's real EDID).
        run: python -m pytest -q
